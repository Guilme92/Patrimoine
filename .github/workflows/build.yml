name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'

      - run: flutter pub get
      - run: flutter analyze
      - name: Tests
        run: |
          for i in 1 2 3 4 5 6; do
            echo "Tentative $i/6"
            if flutter test; then exit 0; fi
            echo "Échec (probable 504 GitHub releases), nouvel essai dans 30 s..."
            sleep 30
          done
          exit 1
      - name: Build APK
        run: |
          for i in $(seq 1 30); do
            echo "Tentative $i/30"
            if flutter build apk --release --split-per-abi; then exit 0; fi
            echo "Échec (probable 504 GitHub releases), nouvel essai dans 15 s..."
            sleep 15
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: patrimoine-android-apk
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk

  windows:
    name: Build Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'

      - run: flutter pub get
      - name: Build Windows
        shell: bash
        run: |
          for i in 1 2 3 4 5 6; do
            echo "Tentative $i/6"
            if flutter build windows --release; then exit 0; fi
            echo "Échec (probable 504 GitHub releases), nouvel essai dans 30 s..."
            sleep 30
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: patrimoine-windows
          path: build/windows/x64/runner/Release/
